name: Salesforce DX Quality Gate

on:
  pull_request:
    paths: ["salesforce/**"]
  push:
    branches: [main]
    paths: ["salesforce/**"]

jobs:
  lwc-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salesforce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: salesforce/package.json
      - run: npm install
      - run: npm run test:lwc
